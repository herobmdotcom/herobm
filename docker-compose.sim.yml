name: herobm-sim
services:
  sim-engine:
    image: localhost/herobm_sim-engine:latest
    build:
      context: .
      dockerfile: apps/sim-engine/Dockerfile
    container_name: sim-engine
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:3005:3005"
    volumes:
      - ./scratch/faketime:/etc/faketime
    depends_on:
      postgres-custom:
        condition: service_healthy
    networks:
      - app-net

  ops-portal:
    image: localhost/herobm_ops-portal:latest
    build:
      context: .
      dockerfile: Dockerfile.portal
    container_name: ops-portal-sim
    restart: unless-stopped
    environment:
      API_URL: http://custom-api-sim:3001
      LD_PRELOAD: "/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1"
      FAKETIME_NO_CACHE: "1"
      FAKETIME_TIMESTAMP_FILE: "/etc/faketime/faketime.rc"
    ports:
      - "${BIND_IP:-127.0.0.1}:${FE_PORT:-8000}:3000"
    depends_on:
      custom-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - app-net
    volumes:
      - ./scratch/faketime:/etc/faketime:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  postgres-custom:
    image: localhost/postgres-custom-sim:latest
    build:
      context: .
      dockerfile: Dockerfile.postgres.sim
    container_name: postgres-custom-sim
    hostname: postgres-custom-sim
    restart: unless-stopped
    command: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-herobm}
      LD_PRELOAD: "/usr/lib/faketime/libfaketime.so.1"
      FAKETIME_NO_CACHE: "1"
      FAKETIME_TIMESTAMP_FILE: "/etc/faketime/faketime.rc"
    ports:
      - "${BIND_IP:-127.0.0.1}:5433:5432"
    volumes:
      - postgres_data_sim:/var/lib/postgresql/data
      - ./configs/postgres:/docker-entrypoint-initdb.d:ro
      - ./scratch/faketime:/etc/faketime:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-herobm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      app-net:
        aliases:
          - postgres-custom

  custom-api:
    image: localhost/herobm_custom-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: custom-api-sim
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3001"
      POSTGRES_HOST: postgres-custom-sim
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-herobm}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4300,http://localhost:4400,http://localhost:5000,http://localhost:8000}
      TYPST_BINARY_PATH: typst
      LD_PRELOAD: "/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1"
      FAKETIME_NO_CACHE: "1"
      FAKETIME_TIMESTAMP_FILE: "/etc/faketime/faketime.rc"
    ports:
      - "${BIND_IP:-127.0.0.1}:${API_PORT:-3001}:3001"
    volumes:
      - ./logs:/app/logs
      - ./scratch/faketime:/etc/faketime:ro
    depends_on:
      postgres-custom:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/metrics').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - app-net
      - monitoring-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis-broker:
    image: docker.io/library/redis:7-alpine
    container_name: redis-broker-sim
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${BIND_IP:-127.0.0.1}:6380:6379"
    volumes:
      - redis_data_sim:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  outbox-worker:
    image: localhost/outbox-worker:latest
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: outbox-worker-sim
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres-custom-sim
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-herobm}
      REDIS_HOST: redis-broker-sim
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LD_PRELOAD: "/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1"
      FAKETIME_NO_CACHE: "1"
      FAKETIME_TIMESTAMP_FILE: "/etc/faketime/faketime.rc"
    ports:
      - "${BIND_IP:-127.0.0.1}:9092:9091"
    volumes:
      - ./logs:/app/logs
      - ./scratch/faketime:/etc/faketime:ro
    depends_on:
      postgres-custom:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    networks:
      - app-net
      - monitoring-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  pipeline-runner:
    image: localhost/herobm_pipeline-runner:latest
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    container_name: pipeline-runner-sim
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres-custom-sim
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-herobm}
      WEBHOOK_URL: "http://sim-engine:3005/api/webhooks"
      VENV_PYTHON: "python3"
      DBT: "dbt"
      LD_PRELOAD: "/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1"
      FAKETIME_NO_CACHE: "1"
      FAKETIME_TIMESTAMP_FILE: "/etc/faketime/faketime.rc"
    volumes:
      - ./logs:/app/logs
      - ./scratch/faketime:/etc/faketime:ro
    depends_on:
      postgres-custom:
        condition: service_healthy
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres_data_sim:
  redis_data_sim:

networks:
  app-net:
    driver: bridge
  monitoring-net:
    driver: bridge
