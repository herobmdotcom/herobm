name: Auto-Close Pull Requests

on:
  pull_request_target:
    types: [opened]

jobs:
  close:
    runs-on: ubuntu-latest
    if: github.actor != 'herobmdotcom' && github.actor != 'emmpeegee'
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Close Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: 'Thank you for your interest in HeroBM. We do not accept public pull requests directly on this repository. For inquiries, feature requests, or commercial licensing, please contact support@herobm.com.'
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed'
            });
