name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  static-and-structural:
    name: Static Analysis & Invariant Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          node scripts/install-native-deps.js

      - name: Initialize Environment Variables
        run: |
          python scripts/init_env.py

      - name: Build Core Packages
        run: |
          make build-shared
          make build-db-schema
          make build-sdk

      - name: Check Types
        run: make check-types

      - name: Check Lint & OAS
        run: make check-lint

      - name: Check Dependency Completeness
        run: make test-deps

      - name: Structural Architecture & Invariant Tests
        run: make test-structural

  unit-tests:
    name: Unit Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API (Shard 1/3)
            run: make test-api-unit SHARD=1/3
          - name: API (Shard 2/3)
            run: make test-api-unit SHARD=2/3
          - name: API (Shard 3/3)
            run: make test-api-unit SHARD=3/3
          - name: Ops Portal
            run: make test-portal-unit
          - name: Packages & Worker
            run: make test-packages-unit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          node scripts/install-native-deps.js

      - name: Initialize Environment Variables
        run: |
          python scripts/init_env.py

      - name: Build Core Packages
        run: |
          make build-shared
          make build-db-schema
          make build-sdk

      - name: Install Typst CLI
        run: |
          if ! command -v typst >/dev/null 2>&1; then
            echo "Installing Typst CLI..."
            curl -fsSL https://github.com/typst/typst/releases/download/v0.12.0/typst-x86_64-unknown-linux-musl.tar.xz | sudo tar -xJ -C /usr/local/bin --strip-components=1 typst-x86_64-unknown-linux-musl/typst
          fi
          typst --version

      - name: Run Unit Tests
        run: ${{ matrix.run }}

  portal-build:
    name: Ops Portal Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          node scripts/install-native-deps.js

      - name: Initialize Environment Variables
        run: |
          python scripts/init_env.py

      - name: Build Core Packages
        run: |
          make build-shared
          make build-db-schema
          make build-sdk

      - name: Verify Portal Production Build
        run: make build-portal

  e2e-api:
    name: Backend API E2E Tests (PostgreSQL)
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: herobm
      USE_PGLITE: false

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: herobm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          node scripts/install-native-deps.js

      - name: Initialize Environment Variables
        run: |
          python scripts/init_env.py

      - name: Build Core Packages
        run: |
          make build-shared
          make build-db-schema
          make build-sdk

      - name: Install Typst CLI
        run: |
          if ! command -v typst >/dev/null 2>&1; then
            echo "Installing Typst CLI..."
            curl -fsSL https://github.com/typst/typst/releases/download/v0.12.0/typst-x86_64-unknown-linux-musl.tar.xz | sudo tar -xJ -C /usr/local/bin --strip-components=1 typst-x86_64-unknown-linux-musl/typst
          fi
          typst --version

      - name: Run Backend API E2E Tests (PostgreSQL)
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: herobm
          USE_PGLITE: false
        run: |
          make test-api-e2e
