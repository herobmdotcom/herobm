name: herobm
services:
  ops-portal:
    image: localhost/herobm_ops-portal:latest
    build:
      context: .
      dockerfile: Dockerfile.portal
    container_name: ops-portal
    restart: unless-stopped
    environment:
      API_URL: http://custom-api:3001
    ports:
      - "${BIND_IP:-127.0.0.1}:${FE_PORT:-8000}:3000"
    depends_on:
      custom-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  postgres-custom:
    image: docker.io/library/postgres:16-alpine
    container_name: postgres-custom
    hostname: postgres-custom
    restart: unless-stopped
    command: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-herobm}
    ports:
      - "${BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres:/docker-entrypoint-initdb.d:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "sh", "-c", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-herobm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      app-net:
        aliases:
          - postgres-custom

  custom-api:
    image: localhost/herobm_custom-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: custom-api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3001"
      POSTGRES_HOST: postgres-custom
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-herobm}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4300,http://localhost:4400,http://localhost:5000,http://localhost:8000}
      TYPST_BINARY_PATH: typst  # Override Windows host path — Alpine has typst on $PATH
    ports:
      - "${BIND_IP:-127.0.0.1}:${API_PORT:-3001}:3001"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres-custom:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/metrics').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - app-net
      - monitoring-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis-broker:
    image: docker.io/library/redis:7-alpine
    container_name: redis-broker
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${BIND_IP:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  outbox-worker:
    image: localhost/outbox-worker:latest
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: outbox-worker
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres-custom
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-herobm}
      REDIS_HOST: redis-broker
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${BIND_IP:-127.0.0.1}:9092:9091"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres-custom:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    networks:
      - app-net
      - monitoring-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  pipeline-runner:
    image: localhost/herobm_pipeline-runner:latest
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    container_name: pipeline-runner
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres-custom
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-herobm}
      WEBHOOK_URL: "http://custom-api:3001/internal/setup/webhook"
      VENV_PYTHON: "python3"
      DBT: "dbt"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres-custom:
        condition: service_healthy
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"



  # --- Maildev (Local Dev Only) ---
  maildev:
    image: maildev/maildev
    container_name: maildev
    profiles:
      - dev
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:1025:1025"
    networks:
      - app-net

volumes:
  postgres_data:
  redis_data:



networks:
  app-net:
    driver: bridge
  monitoring-net:
    driver: bridge
