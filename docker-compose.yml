services:
  postgres-custom:
    image: postgres:16-alpine
    container_name: postgres-custom
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-custom_app}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  custom-api:
    image: localhost/modbm_custom-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: custom-api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3001"
      POSTGRES_HOST: postgres-custom
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-custom_app}
      JWT_SECRET: ${JWT_SECRET}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD}
      DEV_VIEWER_PASSWORD: ${DEV_VIEWER_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4300}
      TYPST_BINARY_PATH: typst  # Override Windows host path — Alpine has typst on $PATH
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres-custom:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - app-net
      - monitoring-net

  redis-broker:
    image: redis:7-alpine
    container_name: redis-broker
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  outbox-worker:
    image: localhost/outbox-worker:latest
    container_name: outbox-worker
    restart: unless-stopped
    profiles:
      - erpnext
    env_file: .env
    environment:
      POSTGRES_HOST: postgres-custom
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-custom_app}
      REDIS_HOST: redis-broker
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ERPNEXT_URL: http://erpnext-backend:8000
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET}
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      postgres-custom:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      erpnext-backend:
        condition: service_started
    networks:
      - app-net
      - erpnext-net
      - monitoring-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - monitoring-net

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./configs/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    # Note: Loki image is scratch-based (no sh/wget/curl), so Docker
    # healthchecks are not possible. We rely on restart policy instead.
    networks:
      - monitoring-net

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./configs/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/pipelines:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_started
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-custom_app}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - app-net
      - monitoring-net

  # ==========================================================================
  # ERPNext Financial Core (Phase 4 — Headless General Ledger)
  # ==========================================================================
  # ERPNext requires MariaDB (not Postgres) and its own Redis instances.
  # These are completely independent — the two systems communicate only
  # via the REST API boundary, per Constitution §3 (Ruthless Decoupling).
  # ==========================================================================

  erpnext-db:
    image: mariadb:10.11
    container_name: erpnext-db
    restart: unless-stopped
    profiles:
      - erpnext
    environment:
      MYSQL_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: erpnext
      MYSQL_USER: erpnext
      MYSQL_PASSWORD: ${ERPNEXT_DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - erpnext_db_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erpnext-net

  erpnext-redis-cache:
    image: redis:7-alpine
    container_name: erpnext-redis-cache
    restart: unless-stopped
    profiles:
      - erpnext
    networks:
      - erpnext-net

  erpnext-redis-queue:
    image: redis:7-alpine
    container_name: erpnext-redis-queue
    restart: unless-stopped
    profiles:
      - erpnext
    networks:
      - erpnext-net

  # One-shot configurator — writes bench config then exits
  erpnext-configurator:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    container_name: erpnext-configurator
    platform: linux/amd64
    restart: on-failure
    profiles:
      - erpnext
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host erpnext-db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://erpnext-redis-cache:6379";
        bench set-config -g redis_queue "redis://erpnext-redis-queue:6379";
        bench set-config -g redis_socketio "redis://erpnext-redis-queue:6379";
        bench set-config -gp socketio_port 9000;
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
    depends_on:
      erpnext-db:
        condition: service_healthy
    networks:
      - erpnext-net

  erpnext-backend:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    container_name: erpnext-backend
    platform: linux/amd64
    restart: unless-stopped
    profiles:
      - erpnext
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    networks:
      - erpnext-net
      - app-net

  erpnext-queue-short:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    container_name: erpnext-queue-short
    platform: linux/amd64
    restart: unless-stopped
    profiles:
      - erpnext
    command: bench worker --queue short,default
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    networks:
      - erpnext-net

  erpnext-queue-long:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    container_name: erpnext-queue-long
    platform: linux/amd64
    restart: unless-stopped
    profiles:
      - erpnext
    command: bench worker --queue long,default,short
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    networks:
      - erpnext-net

  erpnext-scheduler:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    container_name: erpnext-scheduler
    platform: linux/amd64
    restart: unless-stopped
    profiles:
      - erpnext
    command: bench schedule
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    networks:
      - erpnext-net

  # ERPNext web UI — only for the finance team (GL reports, bank rec)
  # Start with: podman compose --profile erpnext --profile finance up
  erpnext-frontend:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    container_name: erpnext-frontend
    platform: linux/amd64
    restart: unless-stopped
    profiles:
      - finance
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: erpnext-backend:8000
      SOCKETIO: erpnext-websocket:9000
      FRAPPE_SITE_NAME_HEADER: $$host
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
    depends_on:
      - erpnext-backend
      - erpnext-websocket
    networks:
      - erpnext-net

  erpnext-websocket:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    container_name: erpnext-websocket
    platform: linux/amd64
    restart: unless-stopped
    profiles:
      - finance
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    networks:
      - erpnext-net

  # --- ELT Pipeline (on-demand, not started by 'podman compose up') ---
  abm-extract:
    build:
      context: ./pipelines/abm_extract
      dockerfile: Dockerfile
    container_name: abm-extract
    profiles:
      - pipeline
    # Credentials are passed explicitly via the environment block below.
    # Do not use env_file — it double-loads variables and can mask misconfiguration.
    environment:
      ABM_MSSQL_HOST: ${ABM_MSSQL_HOST}
      ABM_MSSQL_DATABASE: ${ABM_MSSQL_DATABASE:-mpgtrial}
      ABM_MSSQL_USER: ${ABM_MSSQL_USER}
      ABM_MSSQL_PASSWORD: ${ABM_MSSQL_PASSWORD}
      POSTGRES_HOST: postgres-custom
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-custom_app}
      PIPELINE_LOG_DIR: /app/logs
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres-custom:
        condition: service_healthy
    networks:
      - app-net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:
  erpnext_db_data:
  erpnext_sites:

networks:
  app-net:
    driver: bridge
  monitoring-net:
    driver: bridge
  erpnext-net:
    driver: bridge
