services:
  ops-portal:
    image: localhost/modbm_ops-portal:latest
    build:
      context: .
      dockerfile: Dockerfile.portal
    container_name: ops-portal
    restart: unless-stopped
    environment:
      API_URL: http://custom-api:3001
    ports:
      - "${BIND_IP:-127.0.0.1}:${FE_PORT:-8000}:3000"
    depends_on:
      custom-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  postgres-custom:
    image: docker.io/library/postgres:16-alpine
    container_name: postgres-custom
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "logging_collector=on"
      - "-c"
      - "log_directory=/var/log/postgresql"
      - "-c"
      - "log_filename=postgres.log"
      - "-c"
      - "log_truncate_on_rotation=on"
      - "-c"
      - "log_rotation_age=1d"
      - "-c"
      - "log_rotation_size=10MB"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-herobm}
    ports:
      - "${BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres:/docker-entrypoint-initdb.d:ro
      - ./logs:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  custom-api:
    image: localhost/modbm_custom-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: custom-api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3001"
      POSTGRES_HOST: postgres-custom
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-herobm}
      JWT_SECRET: ${JWT_SECRET}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD}
      DEV_VIEWER_PASSWORD: ${DEV_VIEWER_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4300,http://localhost:4400,http://localhost:5000,http://localhost:8000}
      TYPST_BINARY_PATH: typst  # Override Windows host path — Alpine has typst on $PATH
    ports:
      - "${BIND_IP:-127.0.0.1}:3001:3001"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres-custom:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - app-net
      - monitoring-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  redis-broker:
    image: docker.io/library/redis:7-alpine
    container_name: redis-broker
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${BIND_IP:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  outbox-worker:
    image: localhost/outbox-worker:latest
    container_name: outbox-worker
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres-custom
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-herobm}
      REDIS_HOST: redis-broker
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${BIND_IP:-127.0.0.1}:9091:9091"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres-custom:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    networks:
      - app-net
      - monitoring-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"



  # --- ELT Pipeline (on-demand, not started by 'podman compose up') ---
  abm-extract:
    build:
      context: ./pipelines/abm_extract
      dockerfile: Dockerfile
    container_name: abm-extract
    profiles:
      - pipeline
    # Credentials are passed explicitly via the environment block below.
    # Do not use env_file — it double-loads variables and can mask misconfiguration.
    environment:
      ABM_MSSQL_HOST: ${ABM_MSSQL_HOST}
      ABM_MSSQL_DATABASE: ${ABM_MSSQL_DATABASE:-mpgtrial}
      ABM_MSSQL_USER: ${ABM_MSSQL_USER}
      ABM_MSSQL_PASSWORD: ${ABM_MSSQL_PASSWORD}
      POSTGRES_HOST: postgres-custom
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-herobm}
      PIPELINE_LOG_DIR: /app/logs
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres-custom:
        condition: service_healthy
    networks:
      - app-net

volumes:
  postgres_data:
  redis_data:



networks:
  app-net:
    driver: bridge
  monitoring-net:
    driver: bridge
