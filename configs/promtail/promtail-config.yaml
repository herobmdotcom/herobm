server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    pipeline_stages:
      - docker: {}
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

  - job_name: elt_pipelines
    static_configs:
      - targets:
          - localhost
        labels:
          job: elt_pipelines
          pipeline: abm_extract
          __path__: /var/log/pipelines/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            ts: ts
      - labels:
          level:
          logger:
