server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: modbm

scrape_configs:
  # ── Container stdout/stderr logs (Podman) ──
  # Podman writes JSON log files to the container storage directory.
  # The Podman machine mounts these into the Promtail container.
  - job_name: container_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: containers
          __path__: /var/log/pods/*/*/*.log
    pipeline_stages:
      # Podman/CRI log lines are in CRI format: <timestamp> <stream> <tag> <log>
      - regex:
          expression: '^(?P<time>[^ ]+) (?P<stream>\w+) \w (?P<log>.*)$'
      - output:
          source: log
      - labels:
          stream:

  # ── ELT pipeline file logs ──
  - job_name: elt_pipelines
    static_configs:
      - targets:
          - localhost
        labels:
          job: elt_pipelines
          pipeline: abm_extract
          __path__: /var/log/pipelines/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            ts: ts
      - labels:
          level:
          logger:
