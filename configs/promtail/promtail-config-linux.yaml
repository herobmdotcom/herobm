server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: modbm

scrape_configs:
  # Container logs via file-based discovery (Linux).
  # Docker's json-file driver writes logs to /var/lib/docker/containers/<id>/<id>-json.log
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
      - output:
          source: log

  # ELT pipeline logs
  - job_name: elt_pipelines
    static_configs:
      - targets:
          - localhost
        labels:
          job: elt_pipelines
          pipeline: abm_extract
          __path__: /var/log/pipelines/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            ts: ts
      - labels:
          level:
          logger:
