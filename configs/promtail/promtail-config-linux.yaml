server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: modbm

scrape_configs:
  # Container logs via file-based discovery (Linux / Podman).
  # Podman stores container logs under /var/log/pods/ in CRI format.
  - job_name: container_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: containers
          __path__: /var/log/pods/*/*/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<time>[^ ]+) (?P<stream>\w+) \w (?P<log>.*)$'
      - output:
          source: log
      - labels:
          stream:

  # ELT pipeline logs
  - job_name: elt_pipelines
    static_configs:
      - targets:
          - localhost
        labels:
          job: elt_pipelines
          pipeline: abm_extract
          __path__: /var/log/pipelines/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            ts: ts
      - labels:
          level:
          logger:
