apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
  - name: Postgres
    type: postgres
    access: proxy
    url: postgres-custom:5432
    user: ${POSTGRES_USER:-postgres}
    jsonData:
      database: ${POSTGRES_DB:-custom_app}
      sslmode: disable
    secureJsonData:
      password: ${POSTGRES_PASSWORD:-postgres}
    isDefault: false
    editable: true
