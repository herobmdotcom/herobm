global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # --- Prometheus self-monitoring ---
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # --- Custom Distribution Platform API (NestJS) ---
  - job_name: 'custom-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['custom-api:3001']

  # --- Outbox Relay Worker (Node) ---
  - job_name: 'outbox-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['outbox-worker:9090']

  # --- Loki (log aggregation) ---
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # --- Promtail (log shipper) ---
  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']

  # --- Grafana (dashboards) ---
  - job_name: 'grafana'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['grafana:3000']

  # EXCEPTION: postgres-custom — Postgres does not expose a /metrics endpoint natively.
  # Scraping requires a dedicated postgres_exporter sidecar container.
  # Tracked for future implementation.

  # EXCEPTION: redis-broker & erpnext-redis-* — Redis does not expose a /metrics endpoint natively.
  # Scraping requires a dedicated redis_exporter sidecar container.
  # Tracked for future implementation.

  # EXCEPTION: erpnext-* containers (Backend/Frontend/Worker) — Frappe does not expose a /metrics
  # endpoint natively on its standard ports. Scraping requires installing a custom Frappe Prometheus app.
  # Tracked for future implementation.

