global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # --- Prometheus self-monitoring ---
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # --- Custom Distribution Platform API (NestJS) ---
  - job_name: 'custom-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['custom-api:3001']

  # --- Outbox Relay Worker (Node) ---
  - job_name: 'outbox-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['outbox-worker:9091']

  # --- Loki (log aggregation) ---
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # --- Promtail (log shipper) ---
  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']

  # --- Grafana (dashboards) ---
  - job_name: 'grafana'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['grafana:3000']

  # --- Postgres (via postgres_exporter sidecar) ---
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # --- Redis (via redis_exporter sidecar) ---
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # EXCEPTION: erpnext-* containers (Backend/Frontend/Worker) — Frappe does not expose a /metrics
  # endpoint natively on its standard ports. Scraping requires installing a custom Frappe Prometheus app.
  # Tracked for future implementation.
  
  # EXCEPTION: ops-portal — Next.js frontend application. Does not expose a /metrics route natively.
  # Telemetry relies on OpenTelemetry traces rather than daemon-style metric scraping.

  # EXCEPTION: abm-extract — Ephemeral Python/dlt pipeline script. Prometheus is pull-based and
  # polling transient scripts introduces race conditions. Observability is handled via Pushgateway or Loki.
