# Docker Compose override for Linux hosts.
# Mounts the Podman container log directory for file-based log collection.
# No socket mount is needed — Podman is daemonless.
#
# Usage: podman compose -f docker-compose.yml -f docker-compose.linux.yml up -d

services:
  promtail:
    volumes:
      - ./configs/promtail/promtail-config-linux.yaml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/pipelines:ro
      - /var/log/pods:/var/log/pods:ro
