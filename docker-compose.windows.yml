# Docker Compose override for Windows hosts.
# Promtail uses file-based log collection from Podman's k8s-file log driver.
# The Podman VM is configured globally with k8s-file via containers.conf.
#
# Log files are stored in the Podman container storage directory. A named
# volume (podman_logs) is pre-created by scripts/setup.ps1 pointing to the
# overlay-containers directory, shared read-only with Promtail.
#
# Usage: podman compose -f docker-compose.yml -f docker-compose.windows.yml up -d

services:
  promtail:
    volumes:
      - ./configs/promtail/promtail-config-windows.yaml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/pipelines:ro
      - podman_logs:/var/log/containers:ro
    security_opt:
      - no-new-privileges:true

volumes:
  podman_logs:
    external: true
